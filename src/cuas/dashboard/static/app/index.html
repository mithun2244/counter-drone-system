<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C-UAS operator dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="top">
    <div id="start">
      <label><span data-text="profile"></span> <select id="profile"></select></label>
      <label><span data-text="scenario"></span> <select id="scenario"></select></label>
      <label><input type="checkbox" id="media"> <span data-text="recordedMedia"></span></label>
      <label><span data-text="zoomCameras"></span>
        <select id="zoom"><option value="" data-text="zoomDefault"></option><option>0</option><option>1</option><option>2</option></select>
      </label>
      <button id="go" class="primary" data-text="start"></button>
      <span id="models" class="models" role="status"></span>
    </div>
    <div id="running">
      <strong id="run-title"></strong>
      <span id="clock" class="clock"></span>
      <button id="play-pause"></button>
      <button id="stop" class="danger" data-text="stop"></button>
      <span id="stop-confirm" class="confirm" role="alertdialog" aria-labelledby="stop-question" hidden>
        <span id="stop-question" data-text="stopQuestion"></span>
        <button id="stop-yes" class="danger" data-text="stopYes"></button>
        <button id="stop-no" data-text="stopNo"></button>
      </span>
      <span class="speeds"><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="5">5×</button></span>
      <label><input type="checkbox" id="sectors" checked> <span data-text="sectors"></span></label>
      <label><input type="checkbox" id="rays"> <span data-text="rays"></span></label>
      <label><input type="checkbox" id="close-up"> <span data-text="closeUp"></span></label>
    </div>
    <span id="message" role="status"></span>
  </header>
  <main>
    <section id="status-panel">
      <div id="banner" role="alert" hidden></div>
      <h2 data-text="status"></h2>
      <p class="note legend"><span class="sim" data-text="sim"></span> <span data-text="simLegend"></span></p>
      <div id="status"></div>
      <h2 data-text="acoustic"></h2>
      <ul id="acoustic"></ul>
    </section>
    <section id="map-panel">
      <canvas id="map"></canvas>
      <div id="video-overlay" hidden>
        <div class="overlay-head">
          <div id="looks" class="tabs" role="tablist"></div>
          <button id="collapse" aria-expanded="true"></button>
        </div>
        <div class="overlay-body">
          <video id="clip" controls muted playsinline></video>
          <div id="clip-note" class="note"></div>
        </div>
      </div>
    </section>
    <section id="side">
      <div id="queue-panel">
        <h2 data-text="alertQueue"></h2>
        <ol id="alerts"></ol>
        <ul id="pre-alerts"></ul>
        <p id="all-clear"></p>
      </div>
      <div id="details-panel" hidden>
        <h2 data-text="selected"></h2>
        <div id="details"></div>
        <h3 data-text="evidence"></h3>
        <div id="evidence"></div>
        <h3 data-text="audioTitle"></h3>
        <div class="note" data-text="audioNote"></div>
        <ul id="sounds"></ul>
        <audio id="audio"></audio>
      </div>
    </section>
  </main>
  <script src="text.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
