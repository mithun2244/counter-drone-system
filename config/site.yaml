# Fictional demo site. All values are start values to tune.
# Local ENU frame in metres (x = east, y = north, z = up), origin at the site centre.
# This is the baseline every scenario shares. Display labels live in scenario metadata.

zoom_per_station: 1  # 0, 1 or 2. Not used until the Phase 4 zoom scheduler.

simulation:
  tick_s: 0.2
  status_period_s: 1.0
  wind_range_loss_per_mps: 0.02

stations:  # equilateral triangle, 500 m sides, on 15 m masts
  - {id: st1, position_enu_m: [0.0, 288.7, 15.0]}
  - {id: st2, position_enu_m: [250.0, -144.3, 15.0]}
  - {id: st3, position_enu_m: [-250.0, -144.3, 15.0]}

pickets:  # 3 km ring, every 45 degrees clockwise from north, 3 m high
  - {id: pk1, position_enu_m: [0.0, 3000.0, 3.0]}
  - {id: pk2, position_enu_m: [2121.3, 2121.3, 3.0]}
  - {id: pk3, position_enu_m: [3000.0, 0.0, 3.0]}
  - {id: pk4, position_enu_m: [2121.3, -2121.3, 3.0]}
  - {id: pk5, position_enu_m: [0.0, -3000.0, 3.0]}
  - {id: pk6, position_enu_m: [-2121.3, -2121.3, 3.0]}
  - {id: pk7, position_enu_m: [-3000.0, 0.0, 3.0]}
  - {id: pk8, position_enu_m: [-2121.3, 2121.3, 3.0]}

zones:  # nested squares; polygon corners are [x, y]; weights from design.md A8
  - id: critical
    weight: 1.0
    polygon_enu_m: [[-100.0, -100.0], [100.0, -100.0], [100.0, 100.0], [-100.0, 100.0]]
  - id: important
    weight: 0.6
    polygon_enu_m: [[-350.0, -350.0], [350.0, -350.0], [350.0, 350.0], [-350.0, 350.0]]
  - id: perimeter
    weight: 0.3
    polygon_enu_m: [[-1000.0, -1000.0], [1000.0, -1000.0], [1000.0, 1000.0], [-1000.0, 1000.0]]

sensors:  # the same suite on every station; 360-degree views because the docs give no camera layout
  rgb:
    p0: 0.95
    sigma_deg: 0.05
    boresight_az_deg: 0.0
    hfov_deg: 360.0
    min_elevation_deg: 0.5
    max_elevation_deg: 85.0
    base_range_m: {attack_drone: 3000.0, quadcopter: 800.0, friendly_drone: 800.0, bird: 800.0}
  thermal:
    p0: 0.90
    sigma_deg: 0.1
    boresight_az_deg: 0.0
    hfov_deg: 360.0
    min_elevation_deg: 0.5
    max_elevation_deg: 85.0
    base_range_m: {attack_drone: 3000.0, quadcopter: 600.0, friendly_drone: 600.0, bird: 500.0}
  acoustic:
    p0: 0.80
    sigma_deg: 5.0
    boresight_az_deg: 0.0
    hfov_deg: 360.0
    min_elevation_deg: -90.0
    max_elevation_deg: 90.0
    base_range_m: {attack_drone: 1500.0, quadcopter: 300.0, friendly_drone: 300.0, bird: 0.0}

picket_settings:
  engines:  # birds have no engine, so pickets cannot hear them
    attack_drone: {type: piston, hearing_radius_m: 1500.0}
    quadcopter: {type: electric, hearing_radius_m: 300.0}
    friendly_drone: {type: electric, hearing_radius_m: 300.0}
  bearing_error_deg: 20.0
  delay_s: [1.0, 2.0]
  report_period_s: 2.0
  engine_guess_accuracy: 0.8
  loudness_sigma: 0.05

gateway:  # design.md A4
  max_future_s: 2.0
  max_age_s: 10.0

tracker:  # design.md A5 and A6; all start values
  position_sensors: [rgb, thermal]  # acoustic bearings never place a target in 3D
  batch_window_s: 0.1  # bearings this close in time are triangulated together
  min_ray_angle_deg: 15.0
  max_ray_miss_m: 30.0
  ray_miss_sigmas: 4.0  # rays must also meet within this many bearing sigmas at range
  ray_join_m: 1.0
  gate_sigmas: 3.0  # the sigma includes the track's own uncertainty
  accel_sigma_mps2: 15.0
  birth_speed_sigma_mps: 60.0
  merge_radius_m: 30.0  # a new fix this close to a live track updates it instead
  confirm_fixes: 3
  confirm_window_s: 2.0
  lost_after_s: 3.0
  acoustic_sector_sigmas: 3.0  # a sector's half-width, in bearing sigmas
  sector_lost_after_s: 6.0

classify:  # design.md A7; all start values
  prior: 0.1
  weights: {look: 1.0, move: 1.0, sound: 1.0}
  clue_floor: 0.02  # each clue is held within [0.02, 0.98]
  picket_engine_heard: 0.9  # birds have no engine
  attack_speed_mps: 30.0
  zoom_look_after_s: 1.5
  move:  # set on Phase 3 tracks, seeds 1-19 except 7 (docs/memory.md)
    window_s: 10.0
    min_history_s: 3.0
    hover_speed_mps: 1.0
    hover_baseline_s: 2.0  # speed from position change, steadier than the filter's velocity
    hover_fraction: 0.2
    fast_speed_mps: 30.0
    fast_straightness: 0.97
    fast_speed_cv: 0.2
    fast_persistence_s: 5.0  # of fresh fixes; coasting never counts
    fast_max_gap_s: 1.0  # a longer gap between fresh fixes restarts persistence
    drone_like: 0.8  # once seen, hovering or sustained fast flight stays for the track
    bird_like: 0.15
    velocity_window_s: 5.0  # time to impact uses a fit over this much fresh history
    velocity_min_span_s: 3.0  # no time to impact before this much; 2 s let a new track jump the queue
    velocity_max_fix_age_s: 6.5  # reach-back limit; a live track can need 6.0 s (2.8 s window + 3.2 s gap)

threat:  # design.md A8
  red: 0.6
  amber: 0.3
  zone_share: 0.5
  urgency_full_s: 30.0
  urgency_floor_s: 180.0
  urgency_at_floor: 0.2
  urgency_beyond: 0.1
  still_speed_mps: 1.0
  approved_flights: []  # none in any scenario

alerts:  # alert identity is separate from track identity
  relink_window_s: 10.0
  relink_gate_sigmas: 3.0
  relink_max_speed_mps: 80.0
  relink_margin_m: 30.0

zoom:  # design.md A9
  period_s: 0.6  # whole ticks; A9's 0.5 s is not
  dwell_s: 3.0
  preempt_margin: 0.2
  magnification: 4.0
  half_fov_deg: 1.0

coverage:  # design.md A10
  zone: important
  cell_m: 25.0
  design_target: quadcopter
  sensor: rgb
  min_stations: 2
  warning_below_pct: 80.0

dashboard:  # docs/dashboard_contract.md
  frame_period_s: 0.4  # 2.5 frames a second at real time; prd.md FR-11 asks for at least 2
  trail_s: 20.0  # design.md B2
  trail_step_s: 0.5
  picket_flash_s: 3.0
  class_threshold: 0.5
  map_margin_fraction: 0.1

station_ai:  # real models on recorded media; all start values
  split:
    fractions: {train: 0.7, test: 0.15, val: 0.15}  # ties go to the earlier split
    salt: cuas-split-v1
    min_test_clips: 3
    audio_block_clips: 5
    scene_max_hamming: 32  # of 256 signature bits; at most this far apart counts as one scene
  detector:
    classes: [drone, bird, airplane, helicopter]
    input_size: 640
    anchor_scales: [0.03, 0.06, 0.12, 0.24, 0.45, 0.7, 0.95]  # torchvision's default starts at 0.2
    min_score: 0.05
    max_candidates: 100  # boxes kept per class before overlap removal
    max_detections: 30
    threads: 4
  look:  # M-of-N confirmation (design.md A3), measured at the look rate
    m: 3
    n: 5
    max_step_fraction: 0.15
    max_missed: 4
    period_s: 0.6  # a whole number of simulation ticks
    range_bins_m: {drone: [20.0, 60.0], bird: [40.0, 120.0]}
  training:  # sized for a CPU-only laptop with 7.7 GB of RAM
    seed: 7
    batch_size: 8
    learning_rate: 0.0005
    weight_decay: 0.0001
    epochs: 20
    max_minutes: 120
    freeze_backbone: true
    train_frames_per_clip: 8
    val_frames_per_clip: 10
  evaluation:
    iou_hit: 0.3
    iou_strict: 0.5
  sound:
    classes: [electric_drone, engine, background]  # engine is a proxy: see data/README.md
    sample_rate: 16000
    window_s: 1.0
    n_fft: 512
    hop: 256
    n_mels: 64
    evaluation_snr_db: [20.0, 10.0, 0.0, -10.0]
    mixing:  # noise gets louder with distance and wind (design.md A2)
      reference_range_m: 100.0
      reference_snr_db: 10.0
      wind_loss_db_per_mps: 0.5
      min_snr_db: -20.0
      max_snr_db: 30.0
    training:
      seed: 7
      batch_size: 16
      learning_rate: 0.001
      weight_decay: 0.0001
      epochs: 30
      windows_per_class: 150  # balanced, because engine clips far outnumber the others
      clean_fraction: 0.3
      snr_range_db: [-10.0, 20.0]
