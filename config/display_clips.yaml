# Real video for the operator dashboard's camera tabs (docs/dashboard_contract.md, /api/display).
# Display only: never footage of the simulated track, never training data and never evidence.
# Kept apart from media_manifest.yaml, whose hash is recorded with the trained weights; a
# SAMPLE entry repeats that file's hash for a held-out (test split) clip. Each clip is
# captioned from its entry as "not footage of this track".
# The DVIDS cuts are committed (rules.md §5 exception); the Svanström clips are not.
# start_s / end_s: play only that stretch of the file (its clear part).
clips:
  shadow_contrails:  # S1 Zoom part 1: the Shadow approaching under contrails, small to large
    type: STAND-IN
    title: RQ-7B Shadow fixed-wing drone
    source: DVIDS
    author: Tech. Sgt. Michael McGhee
    licence: public domain
    source_title: RQ-7B Shadow Flight Demonstration
    source_url: https://www.dvidshub.net/video/493473/rq-7b-shadow-flight-demonstration
    downloaded: "2026-11-15"
    edits: "02:05.3 to 02:10.8 of the source, cropped to 640x360 at (256, 0), audio removed"
    path: standin/rq7b_shadow_dvids_493473_contrails.mp4
    sha256: 266411dbc11938e669be84954130f9e1fc42cb83769e218ff47c1b232d238c09
  shadow_lowpass:  # S1 Zoom part 2: a low approach, ending before grass enters the frame
    type: STAND-IN
    title: RQ-7B Shadow fixed-wing drone
    source: DVIDS
    author: Tech. Sgt. Michael McGhee
    licence: public domain
    source_title: RQ-7B Shadow Flight Demonstration
    source_url: https://www.dvidshub.net/video/493473/rq-7b-shadow-flight-demonstration
    downloaded: "2026-11-15"
    edits: "02:13.8 to 02:20.5 of the source, cropped to 640x360 at (192, 30), audio removed"
    path: standin/rq7b_shadow_dvids_493473_lowpass.mp4
    sha256: 20da25d4324ea62c681de9d3a037dba192d1b00cf2b804a1557992fcd5b11371
  shadow_near:  # S1 Zoom part 3: the Shadow flying away after launch
    type: STAND-IN
    title: RQ-7B Shadow fixed-wing drone
    source: DVIDS
    author: Tech. Sgt. Michael McGhee
    licence: public domain
    source_title: RQ-7B Shadow Flight Demonstration
    source_url: https://www.dvidshub.net/video/493473/rq-7b-shadow-flight-demonstration
    downloaded: "2026-11-15"
    edits: "02:28.0 to 02:35.0 of the source, cropped to 640x360 at (192, 90), audio removed"
    path: standin/rq7b_shadow_dvids_493473.mp4
    sha256: 4fb1eca4e6985819b8d2a593739c5fcedf8f6ddcb3810f87abc3eb68862d1eed
  f450_027:  # S2 Zoom part 1: held-out (test split), close bin
    type: SAMPLE
    dataset: Svanström Drone Detection Dataset
    source_title: V_DRONE_027
    path: svanstrom/Data/Video_V/V_DRONE_027.mp4
    sha256: ae0e55cc59c9f7be52fb3108d622af6ff2b8a3119ac986f4c14d8dc44fce0806
  f450_033:  # S2 Zoom part 2: held-out (test split), medium bin; clear for its first 4 s
    type: SAMPLE
    dataset: Svanström Drone Detection Dataset
    source_title: V_DRONE_033
    path: svanstrom/Data/Video_V/V_DRONE_033.mp4
    sha256: 784f1365d7db9e9522d3ad7fd121bc3fe4c7bd65d0c50ada9e844b162a1b6d96
    end_s: 4.0
  f450_032:  # S2 Zoom part 3: held-out (test split), medium bin; clear from 2 s to 9 s
    type: SAMPLE
    dataset: Svanström Drone Detection Dataset
    source_title: V_DRONE_032
    path: svanstrom/Data/Video_V/V_DRONE_032.mp4
    sha256: 934a8723663b2d3ea5505f4ca6639dc3829a4f8554cb0b695f0491aa12e71834
    start_s: 2.0
    end_s: 9.0

# Which clips each camera tab plays, per scenario, in turn with a crossfade. A scenario listed
# here has no Thermal tab; a tab with no clip keeps the simulated view.
scenarios:
  s1: {zoom: [shadow_contrails, shadow_lowpass, shadow_near]}  # about 19 s
  s2: {zoom: [f450_027, f450_033, f450_032]}  # about 21 s, all under the same overcast sky
  s5: {zoom: shadow_near}  # hidden from the demo; kept as it was

# Option B: no video until a zoom camera is on the track (text before that), then only the
# Zoom tab; S2's panel opens by itself then, as S1's does.
zoom_only: [s1, s2]
