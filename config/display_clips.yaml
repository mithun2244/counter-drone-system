# Which clip each camera tab plays, per scenario. A scenario listed here has no Thermal tab,
# and its Wide and Zoom tabs play these clips instead of the simulated camera view (S1) or the
# look clip the detector ran on (S2); a tab with no clip keeps the simulated view.
scenarios:
  s1: {wide: shadow_far, zoom: shadow_near}
  s2: {wide: f450_distant, zoom: f450_close}
  s5: {zoom: shadow_near}  # hidden from the demo; kept as it was
